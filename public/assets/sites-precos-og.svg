<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGradient" x1="600" y1="180" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.62" stop-color="#f472b6"/>
      <stop offset="0.82" stop-color="#facc15"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 210) scale(520 220)">
      <stop stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#softGlow)" opacity="0.42"/>

  <g transform="translate(466 108)">
    <rect x="0" y="0" width="188" height="36" rx="18" fill="#030303"/>
    <rect x="0.8" y="0.8" width="186.4" height="34.4" rx="17.2" stroke="url(#ringGradient)" stroke-width="1.6"/>
    <circle cx="24" cy="17" r="3.5" fill="url(#ringGradient)"/>
    <text x="42" y="22" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Sites profissionais</text>
  </g>

  <text x="600" y="280" text-anchor="middle" fill="url(#titleGradient)" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="400" letter-spacing="0">
    Criação de sites.
  </text>

  <text x="600" y="365" text-anchor="middle" fill="#a1a1aa" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500">
    Do site vitrine ao painel de controle, com SEO técnico e presença no Google.
  </text>
</svg>
